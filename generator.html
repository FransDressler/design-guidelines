<!doctype html>
<html lang="de" data-palette="paper" data-type="technical" data-radius="crisp" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator – eine Website-Permutation pro Seed</title>
<meta name="description" content="Seed eingeben, und der Generator kombiniert Layout, Palette, Schrift, Radius, Dichte, Motion, Skeleton und Sticker zu einer Seite. Gleicher Seed, gleiche Seite.">
<link rel="canonical" href="https://fransdressler.github.io/design-guidelines/generator.html">
<meta property="og:title" content="Generator – Blank Library"><meta property="og:description" content="Eine Website-Permutation pro Seed."><meta property="og:type" content="website"><meta property="og:url" content="https://fransdressler.github.io/design-guidelines/generator.html"><meta property="og:image" content="https://picsum.photos/seed/gen/1200/630"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="tokens/tokens.css"><link rel="stylesheet" href="tokens/base.css">
<script src="tokens/fonts.js"></script>
<style>
body{display:grid;grid-template-columns:340px 1fr;min-height:100svh}
aside{padding:24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow:auto}
aside select{width:100%;min-height:44px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;font:inherit}
.frame{position:relative;background:var(--surface)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vp{display:flex;gap:6px}
.frame.m iframe{width:390px;left:50%;transform:translateX(-50%);border-inline:1px solid var(--line)}
pre{font:12px/1.5 var(--font-mono);white-space:pre-wrap;background:var(--surface);padding:12px;border-radius:var(--r);margin:0}
@media(max-width:860px){body{grid-template-columns:1fr}aside{border-right:0}.frame{height:80svh}.frame.m iframe{width:100%}}
</style>
</head>
<body>
<aside>
  <p class="label"><a href="./">Blank</a> / Generator</p>
  <h1 style="font-size:var(--fs-h3)">Eine Seite pro Seed</h1>
  <div><label for="seed">Seed</label><input id="seed" value="baeckerei-luebeck"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="roll">Würfeln</button><button class="btn ghost" id="apply">Seed anwenden</button></div>
  <div id="axes" class="stack"></div>
  <div class="vp"><button class="chip" data-vp="d">Desktop</button><button class="chip" data-vp="m">Mobil</button><a class="chip" id="open" target="_blank" rel="noopener">Öffnen ↗</a></div>
  <div><p class="label">Für den Agenten</p><pre id="cli"></pre></div>
</aside>
<main class="frame" id="frame"><iframe id="view" title="Vorschau der generierten Seite"></iframe></main>
<script>
const AX = {
  layout: ['editorial', 'manifesto', 'portfolio', 'poster', 'shop', 'split'],
  palette: [], type: [], radius: [], density: [],
  motion: ['calm', 'lively', 'bold'], skeleton: ['pixel', 'scan', 'blur', 'type'],
  stickers: ['none', 'stamp', 'tape', 'badge', 'scribble'], grain: ['off', 'on'],
};
// identical to tools/permute.js so seeds match the CLI
function permute(seed) {
  let h = 1779033703;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  const rnd = () => { h |= 0; h = h + 0x6D2B79F5 | 0; let x = Math.imul(h ^ h >>> 15, 1 | h); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const p = {}; for (const [k, v] of Object.entries(AX)) p[k] = v[Math.floor(rnd() * v.length)]; return p;
}
const $ = s => document.querySelector(s);
let cur;
function render(p) {
  cur = p;
  $('#axes').innerHTML = Object.entries(AX).map(([k, v]) => `<div><label for="ax-${k}">${k}</label><select id="ax-${k}" data-k="${k}">${v.map(o => `<option ${o === p[k] ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`).join('');
  $('#axes').querySelectorAll('select').forEach(s => s.onchange = () => { cur[s.dataset.k] = s.value; show(); });
  show();
}
function show() {
  const { layout, ...rest } = cur;
  const url = `layouts/${layout}.html?` + new URLSearchParams(rest);
  $('#view').src = url; $('#open').href = url;
  $('#cli').textContent = `node tools/permute.js ${$('#seed').value}\n\n<html lang="de" ${Object.entries(rest).map(([k, v]) => `data-${k}="${v}"`).join(' ')}>\nVorlage: layouts/${layout}.html`;
}
document.querySelectorAll('[data-vp]').forEach(b => b.onclick = () => $('#frame').classList.toggle('m', b.dataset.vp === 'm'));
$('#apply').onclick = () => render(permute($('#seed').value));
$('#roll').onclick = () => { $('#seed').value = Math.random().toString(36).slice(2, 8); render(permute($('#seed').value)); };
fetch('tokens/tokens.json').then(r => r.json()).then(t => {
  for (const k of ['palette', 'type', 'radius', 'density']) AX[k] = Object.keys(t[k === 'palette' ? 'palettes' : k]);
  const s = new URLSearchParams(location.search).get('seed'); if (s) $('#seed').value = s;
  render(permute($('#seed').value));
});
</script>
</body>
</html>
